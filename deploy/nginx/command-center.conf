# nginx: serve the command center under /command-center/ on an existing TLS server block.
# Matching app config: server.basePath "/command-center/", server.trustProxy true.
#
# Option A (default): the app's own password sign-in (auth.mode "password"). nginx only proxies.
# Option B: nginx authenticates (basic auth, oauth2-proxy, ...). Set auth.mode "proxy" in the app and
#           auth.trustedPeerUids [<nginx worker uid>, e.g. 33 for www-data] so nothing else on the
#           machine can bypass nginx by talking to the port directly. Uncomment the auth_basic lines.

location = /command-center {
    return 301 /command-center/;
}

location ^~ /command-center/ {
    # auth_basic "Command Center";
    # auth_basic_user_file /etc/nginx/command-center.htpasswd;

    proxy_pass http://127.0.0.1:18821;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Talk events are long-polled for up to ~25 s.
    proxy_read_timeout 150s;
    client_max_body_size 512k;
}
